{% load static %}
<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Recurso | Gestum</title>

    <link rel="stylesheet" href="{% static 'resources/css/resource_form.css' %}">
</head>

<body>

    <main class="page-container">

        <!-- Cabeçalho -->
        <header class="page-header">

            <h1 class="logo">Gestum</h1>

            <a href="#" class="back-button" aria-label="Voltar">
                <span class="arrow"></span>
            </a>

        </header>


        <!-- Formulário -->
        <section class="form-card">

            <h2 class="form-title">
                Criar recurso
            </h2>

            <form class="resource-form">

                <!-- Nome -->
                <div class="form-group">

                    <label for="nome">
                        Nome:
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        class="form-control"
                        placeholder="Nome do recurso"
                        required
                    >

                </div>


                <!-- Observações -->
                <div class="form-group">

                    <label for="observacoes">
                        Observações:
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        class="form-control form-textarea"
                        placeholder="Observações sobre o recurso"
                    ></textarea>

                </div>


                <!-- Área de feedback -->
                <div class="form-message success">
                    Recurso criado com sucesso.
                </div>


                <!-- Botão -->
                <button
                    type="submit"
                    class="button button-primary"
                >
                    Criar
                </button>

            </form>

        </section>

    </main>

</body>
</html>
