{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'resources/css/resource_list.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <title>Gestum - Recursos</title>
</head>

<body>
    <header>
        <div>
            <span>Logo Gestum</span>
        </div>
        <div>
            <a href="{% url 'core:home' %}" class="link-voltar"><i class="fa-regular fa-circle-left fa-2xl" style="color: #6b3030;"></i></a>
        </div>
    </header>

    <main>
        <div class="container-btn-criar">
            <a class="btn-criar-recurso" href="{% url 'resource:resource_create' %}">Criar recurso</a>
        </div>

        <div class="container-recursos">
            {% for recurso in object_list %}
                <div class="recurso">
                    <div class="recurso-header">
                        <h2>{{ recurso.nome }}</h2>

                        <div class="edit-delete">
                            <a href="{% url 'resource:resource_update' recurso.nome %}">
                                <i class="fa-solid fa-pen-to-square fa-lg" style="color: #692f2f;"></i>
                            </a>
                            <a href="{% url 'resource:resource_delete' recurso.nome %}">
                                <i class="fa-solid fa-trash" style="color: #bd180f;"></i>
                            </a>
                        </div>
                    </div>
                    <div class="recurso-actions">
                        <a href="{% url 'tickets:ticket_create' %}" class="recurso-action">
                            <i class="fa-solid fa-triangle-exclamation" style="color: #bd180f;"></i>
                            Abrir chamado
                        </a>

                        <a href="{% url 'reservations:reservation_create' %}" class="recurso-action">
                            <i class="fa-solid fa-calendar" style="color: #6b3030;"></i>
                            Reservar recurso
                        </a>

                        <div class="recurso-action">
                            <i class="fa-solid fa-circle-check fa-lg" style="color: #2ba84a;"></i>
                            {{ recurso.status }}
                        </div>
                    </div>
                </div>
            {% empty %}
                <div>
                    <h2>Não foi possível encontrar nenhum usuario!</h2>
                </div>
            {% endfor %}
        </div>
    </main>
</body>

</html>
