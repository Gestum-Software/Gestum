{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="{% static 'core/css/dashboard.css' %}">

    <title>Gestum - Dahsboard</title>
</head>
<body>
    <header>
        <div class="logo">GESTUM</div>
        <i class="dashboard-settings-icon fa-solid fa-gear fa-2xl fa-width-auto"
           aria-label="Configurações"
           role="img"></i>
    </header>

    <main>
        <section id="section-links">
            <div class="dashboard-links">
                <a class="dashboard-link" href="{% url 'resource:resource_list' %}">Recursos</a>
                <a class="dashboard-link" href="{% url 'tickets:ticket_list' %}">Chamados</a>
                <a class="dashboard-link" href="{% url 'reservations:reservation_list' %}">Reservas</a>
                {% if perms.accounts.view_customuser %}
                <a class="dashboard-link link-usuario" href="{% url 'accounts:accounts_list' %}">Usuários</a>
                {% endif %}
            </div>
        </section>
    </main>

    <aside class="dashboard-settings-painel" aria-label="Painel lateral de configurações">
        <div class="superior-part">
            <div class="username-mensage">
                <h1>Olá {{ username }}!</h1>
            </div>
            <a class="edit-profile" href="#">
                Editar perfil
            </a>
        </div>

        <div>
            {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:accounts_logout' %}">
                {% csrf_token %}
                <button class="logout-btn" type="submit">Sair</button>
            </form>
            {% endif %}
        </div>        
    </aside>
</body>
</html>
