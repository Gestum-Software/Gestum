
{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <link rel="stylesheet" href="{% static 'tickets/css/ticket_detail.css' %}">
    
    <title>Gestum - {{ object.titulo }}</title>
</head>
<body>
    <header>
        <div>
            <span>Logo Gestum</span>
        </div>
        <div>
            <a href="{% url 'tickets:ticket_list' %}" class="link-voltar">
                <i class="fa-regular fa-circle-left fa-2xl" style="color: #6b3030;"></i>
            </a>
        </div>
    </header>

    <main>
        <div id="ticket-modal">
            <h1>{{ object.titulo }}</h1>

            <div class="container-ticket-data">
                <div class="ticket-data">
                    <p class="label" >Titulo:</p>
                    <div class="data">{{ object.titulo }}</div>
                </div>

                <div class="ticket-data">
                    <p class="label" >Descrição:</p>
                    <div class="data description-data">{{ object.descricao }}</div>
                </div>
            </div>

            <a href="{% url 'tickets:ticket_list' %}" class="back-button">Fechar</a>
        </div>
    </main>
</body>
</html>
