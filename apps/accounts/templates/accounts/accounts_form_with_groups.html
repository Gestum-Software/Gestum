{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="{% static 'accounts/css/accounts_form_with_groups.css' %}">

    <title>Gestum - Criar usuario</title>
</head>
<body>
    <header>
        <div>
            <span>Logo Gestum</span>
        </div>
        <div>
            <a href="{% url 'core:home' %}" class="link-voltar">
                <i class="fa-regular fa-circle-left fa-2xl" style="color: #6b3030;"></i>
            </a>
        </div>
    </header>

    <main>
        <div id="form-modal">
            <h1>Criar usuário</h1>

            <div class="container-form">
                <form class="form" action="" method="POST">
                    {% csrf_token %}
                    {{ form.as_div }}

                    <button class="form-button" type="submit">
                        Criar
                    </button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
